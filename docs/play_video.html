<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Player</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --accent: #4FC3F7;
      --text: #e4e4e7;
      --muted: #9ca3af;
      --border: #2a2d3a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { font-size: 20px; font-weight: 700; }
    .hint { color: var(--muted); font-size: 13px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    video {
      max-width: 100%;
      max-height: 80vh;
      height: auto;
      border-radius: 12px;
      background: #000;
      display: block;
      margin: 0 auto;
    }
    .video-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      z-index: 2;
    }
    .play-btn:hover { background: rgba(79, 195, 247, 0.45); transform: translate(-50%, -50%) scale(1.1); }
    .play-btn svg { width: 36px; height: 36px; fill: #fff; margin-left: 4px; }
    .play-btn.hidden { display: none; }
    .actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      background: rgba(79, 195, 247, 0.10);
    }
    a.button:hover { border-color: rgba(79, 195, 247, 0.45); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Video Player</h1>
      <div class="hint">Open this file in your browser to play</div>
    </div>

    <div class="card">
      <div class="video-wrap">
        <video id="vid" playsinline preload="metadata">
          <source src="./F8E776DF-95E3-4824-8995-FD35969C9BEB.mp4" type="video/mp4" />
          Your browser does not support playing this video. Try downloading and opening it with a local player.
        </video>
        <button class="play-btn" id="playBtn" aria-label="Play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <div class="actions">
        <a class="button" href="./F8E776DF-95E3-4824-8995-FD35969C9BEB.mp4" download>Download Video</a>
      </div>
    </div>
  </div>
<script>
  const vid = document.getElementById('vid');
  const btn = document.getElementById('playBtn');
  btn.addEventListener('click', () => {
    vid.controls = true;
    vid.play();
    btn.classList.add('hidden');
  });
  vid.addEventListener('pause', () => { if (!vid.ended) btn.classList.remove('hidden'); });
  vid.addEventListener('play', () => btn.classList.add('hidden'));
  vid.addEventListener('ended', () => { btn.classList.remove('hidden'); vid.controls = false; });
</script>
</body>
</html>
